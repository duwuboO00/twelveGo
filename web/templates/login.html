<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/web/static/css/style.css">
</head>
<body>
    <h1>Login</h1>
    <form action="/auth/login" method="post">
        <div>
            <label for="google_id">Google ID:</label>
            <input type="text" id="google_id" name="google_id" required>
        </div>
        <button type="submit">Login</button>
    </form>
    {{ if .error }}
    <p style="color: red;">{{ .error }}</p>
    {{ end }}
</body>
</html>
